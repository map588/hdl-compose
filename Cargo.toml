[package]
name = "hdl-compose"
version = "0.1.0"
edition = "2024"

[lib]
name = "hdl_compose"
path = "src/lib.rs"

[[bin]]
name = "hdl-compose"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
cxx = "1"
cxx-qt = "0.8"
cxx-qt-lib = { version = "0.8", features = ["qt_gui"] }
schemars = "1.2.1"
seahash = "4.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sv-parser = "0.13.5"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
vhdl_lang = "0.86.0"
yaml-rust2 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
cxx-qt-build = { version = "0.8", features = ["link_qt_object_files"] }
